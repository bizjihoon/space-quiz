<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Explorer Quiz</title>
    <style>
      :root {
        --bg-1: #050816;
        --bg-2: #101a36;
        --panel: rgba(13, 20, 42, 0.82);
        --panel-strong: rgba(18, 29, 59, 0.96);
        --primary: #7c9cff;
        --primary-2: #7ee7ff;
        --accent: #ffb84d;
        --success: #3ddc97;
        --danger: #ff6b7d;
        --text: #edf4ff;
        --muted: #b9c6e3;
        --shadow: rgba(67, 130, 255, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top, rgba(124, 156, 255, 0.28), transparent 35%),
          radial-gradient(circle at bottom right, rgba(126, 231, 255, 0.24), transparent 25%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .quiz-shell {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(3, 6, 20, 0.65), 0 0 24px var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .topbar {
        background: rgba(255, 255, 255, 0.03);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 20px 22px 16px;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(124, 156, 255, 0.14);
        border: 1px solid rgba(124, 156, 255, 0.32);
      }

      .badge::before {
        content: "★";
        color: var(--accent);
      }

      .score {
        font-weight: 700;
        color: var(--primary-2);
        font-size: 1rem;
      }

      .progress-track {
        position: relative;
        width: 100%;
        height: 12px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--accent));
        box-shadow: 0 0 18px rgba(126, 231, 255, 0.7);
        transition: width 0.35s ease;
      }

      .content {
        padding: 28px 22px 22px;
      }

      .quiz-panel {
        display: block;
      }

      .quiz-panel[hidden] {
        display: none;
      }

      .question-meta {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(1.9rem, 2vw + 1rem, 3rem);
        line-height: 1.2;
      }

      .answers {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .option {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        padding: 16px 18px;
        border-radius: 16px;
        font-size: 1rem;
        text-align: left;
        cursor: pointer;
        transform: translateY(0);
        transition:
          transform 0.15s ease,
          border-color 0.25s ease,
          background 0.3s ease,
          box-shadow 0.3s ease,
          color 0.3s ease,
          filter 0.2s ease;
      }

      .option:hover {
        transform: translateY(-1px);
        border-color: rgba(126, 231, 255, 0.7);
      }

      .option:active {
        transform: translateY(2px) scale(0.995);
        filter: brightness(0.96);
      }

      .option:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(126, 231, 255, 0.9);
        box-shadow: 0 0 0 4px rgba(126, 231, 255, 0.22), 0 0 18px rgba(126, 231, 255, 0.2);
        outline: none;
      }

      .option.correct {
        background: rgba(61, 220, 151, 0.16);
        border-color: rgba(61, 220, 151, 0.8);
        color: #dffef1;
        box-shadow: inset 0 0 0 1px rgba(61, 220, 151, 0.3);
        transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, color 0.35s ease, transform 0.2s ease;
      }

      .option.incorrect {
        background: rgba(255, 107, 125, 0.12);
        border-color: rgba(255, 107, 125, 0.8);
        color: #ffe5eb;
        box-shadow: inset 0 0 0 1px rgba(255, 107, 125, 0.2);
        transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, color 0.35s ease, transform 0.2s ease;
      }

      .option:disabled {
        cursor: default;
        opacity: 1;
      }

      .feedback {
        min-height: 34px;
        margin-top: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.05rem;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .feedback.show {
        opacity: 1;
        transform: scale(1);
      }

      .feedback.correct {
        color: var(--success);
        text-shadow: 0 0 20px rgba(61, 220, 151, 0.7);
      }

      .feedback.incorrect {
        color: var(--danger);
        text-shadow: 0 0 20px rgba(255, 107, 125, 0.7);
      }

      .feedback.correct::before {
        content: "✓ ";
      }

      .feedback.incorrect::before {
        content: "✕ ";
      }

      .result-panel {
        display: none;
        text-align: center;
        padding: 18px 12px 10px;
      }

      .result-panel.show {
        display: block;
      }

      .result-emoji {
        font-size: clamp(3rem, 5vw, 5rem);
        margin-bottom: 12px;
        animation: float 1.8s ease-in-out infinite;
      }

      .result-panel h2 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .result-score {
        font-size: 1.2rem;
        color: var(--muted);
        margin-bottom: 20px;
      }

      .result-score strong {
        color: var(--text);
        font-size: 2rem;
      }

      .result-message {
        margin: 0 auto 24px;
        max-width: 34ch;
        color: var(--muted);
        line-height: 1.6;
      }

      .review-toggle-wrap {
        margin: 0 auto 18px;
      }

      .review-toggle-btn {
        border: 1px solid rgba(126, 231, 255, 0.45);
        background: rgba(126, 231, 255, 0.08);
        color: var(--text);
        font-weight: 700;
        font-size: 0.98rem;
        padding: 12px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .review-toggle-btn:hover,
      .review-toggle-btn:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(126, 231, 255, 0.9);
        box-shadow: 0 0 0 4px rgba(126, 231, 255, 0.18);
        outline: none;
      }

      .review-panel {
        text-align: left;
        margin: 0 auto 18px;
        max-width: 680px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        padding: 18px 16px;
      }

      .review-panel[hidden] {
        display: none;
      }

      .review-panel h3 {
        margin: 0 0 14px;
        font-size: 1.2rem;
      }

      .review-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .review-item {
        background: rgba(124, 156, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 14px 16px;
      }

      .review-item strong {
        display: block;
        margin-bottom: 8px;
        color: var(--primary-2);
      }

      .review-item p {
        margin: 0 0 6px;
        color: var(--muted);
        line-height: 1.5;
      }

      .review-status {
        font-weight: 700;
      }

      .review-status.correct {
        color: var(--success);
      }

      .review-status.incorrect {
        color: var(--danger);
      }

      .restart-btn {
        border: none;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #04111d;
        font-weight: 800;
        font-size: 1rem;
        padding: 14px 22px;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 10px 28px rgba(124, 156, 255, 0.38);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .restart-btn:hover,
      .restart-btn:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(124, 156, 255, 0.48);
        outline: none;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @media (max-width: 540px) {
        body {
          padding: 14px;
        }

        .content {
          padding: 22px 16px 18px;
        }

        h1 {
          font-size: 1.7rem;
        }

        .option {
          padding: 14px 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="quiz-shell" aria-live="polite">
      <header class="topbar">
        <div class="status-row">
          <div class="badge">미션 컨트롤</div>
          <div class="score" id="scoreCounter" aria-live="polite">점수: 0</div>
        </div>
        <div class="progress-track" aria-label="퀴즈 진행률">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </header>

      <section class="content">
        <div class="quiz-panel" id="quizPanel">
          <div class="question-meta" id="questionMeta">문제 1 / 10</div>
          <h1 id="questionText">문제를 불러오는 중...</h1>

          <div class="answers" id="answers" role="list"></div>
          <div id="feedback" class="feedback" aria-live="assertive"></div>
        </div>

        <div class="result-panel" id="resultPanel" aria-live="polite">
          <div class="result-emoji" id="resultEmoji">🚀</div>
          <h2 id="resultTitle">미션 완료</h2>
          <div class="result-score"><strong id="finalScore">0</strong> / 10</div>
          <p class="result-message" id="resultMessage">우주 탐사 퀴즈를 끝냈습니다.</p>

          <div class="review-toggle-wrap">
            <button class="review-toggle-btn" id="reviewToggleBtn" type="button" aria-expanded="false">답안 다시 보기</button>
          </div>

          <div class="review-panel" id="reviewPanel" hidden aria-live="polite">
            <h3>답안 복기</h3>
            <ul class="review-list" id="reviewList"></ul>
          </div>

          <button class="restart-btn" id="restartBtn" type="button">다시 하기</button>
        </div>
      </section>
    </main>

    <script>
      const questions = [
        {
          question: '붉은 행성으로 알려진 행성은 무엇인가요?',
          options: ['금성', '화성', '목성', '수성'],
          answer: '화성'
        },
        {
          question: '지구의 자연 위성 이름은 무엇인가요?',
          options: ['타이탄', '유로파', '달', '가니메데'],
          answer: '달'
        },
        {
          question: '달에 첫으로 착륙한 우주선은 무엇인가요?',
          options: ['아폴로 11호', '보이저 1호', '스푸트니크 1호', '허블'],
          answer: '아폴로 11호'
        },
        {
          question: '태양 주위를 도는 행성을 유지하는 힘은 무엇인가요?',
          options: ['자력', '중력', '복사선', '마찰력'],
          answer: '중력'
        },
        {
          question: '가장 두드러진 고리를 가진 행성은 무엇인가요?',
          options: ['토성', '해왕성', '화성', '지구'],
          answer: '토성'
        },
        {
          question: '우리 태양계가 속한 은하의 이름은 무엇인가요?',
          options: ['안드로메다', '소용돌이 은하', '은하수', '솜브레로 은하'],
          answer: '은하수'
        },
        {
          question: '우리 태양계에서 가장 뜨거운 행성은 무엇인가요?',
          options: ['금성', '수성', '화성', '목성'],
          answer: '금성'
        },
        {
          question: '우주에서 숨을 쉬기 위해 우주인이 사용하는 것은 무엇인가요?',
          options: ['산소 탱크', '헬륨 풍선', '물 필터', '태양 전지판'],
          answer: '산소 탱크'
        },
        {
          question: '1990년에 발사되어 천문학을 바꾼 우주 망원경은 무엇인가요?',
          options: ['스피처', '허블', '케플러', '제임스 웹'],
          answer: '허블'
        },
        {
          question: '우리 태양계에서 가장 큰 행성은 무엇인가요?',
          options: ['해왕성', '토성', '목성', '천왕성'],
          answer: '목성'
        }
      ];

      const quizPanel = document.getElementById('quizPanel');
      const resultPanel = document.getElementById('resultPanel');
      const questionMeta = document.getElementById('questionMeta');
      const questionText = document.getElementById('questionText');
      const answersEl = document.getElementById('answers');
      const feedbackEl = document.getElementById('feedback');
      const scoreCounter = document.getElementById('scoreCounter');
      const progressFill = document.getElementById('progressFill');
      const finalScore = document.getElementById('finalScore');
      const resultTitle = document.getElementById('resultTitle');
      const resultEmoji = document.getElementById('resultEmoji');
      const resultMessage = document.getElementById('resultMessage');
      const reviewToggleBtn = document.getElementById('reviewToggleBtn');
      const reviewPanel = document.getElementById('reviewPanel');
      const reviewList = document.getElementById('reviewList');
      const restartBtn = document.getElementById('restartBtn');

      let currentQuestionIndex = 0;
      let score = 0;
      let selectedAnswers = Array(questions.length).fill(null);

      function updateProgress() {
        const percent = ((currentQuestionIndex) / questions.length) * 100;
        progressFill.style.width = `${percent}%`;
      }

      function updateScore() {
        scoreCounter.textContent = `점수: ${score}`;
      }

      function showFeedback(isCorrect, message) {
        feedbackEl.textContent = message;
        feedbackEl.classList.remove('correct', 'incorrect', 'show');
        if (isCorrect) {
          feedbackEl.classList.add('correct');
        } else {
          feedbackEl.classList.add('incorrect');
        }
        feedbackEl.classList.add('show');
      }

      function loadQuestion() {
        const currentQuestion = questions[currentQuestionIndex];
        questionMeta.textContent = `문제 ${currentQuestionIndex + 1} / ${questions.length}`;
        questionText.textContent = currentQuestion.question;
        answersEl.innerHTML = '';
        feedbackEl.classList.remove('show', 'correct', 'incorrect');
        feedbackEl.textContent = '';

        currentQuestion.options.forEach((option) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'option';
          button.textContent = option;
          button.setAttribute('role', 'listitem');

          button.addEventListener('click', () => handleAnswer(button, option, currentQuestion.answer));
          answersEl.appendChild(button);
        });

        updateProgress();
      }

      function handleAnswer(button, selectedOption, correctAnswer) {
        selectedAnswers[currentQuestionIndex] = selectedOption;

        const allButtons = Array.from(document.querySelectorAll('.option'));
        allButtons.forEach((btn) => {
          btn.disabled = true;
          if (btn.textContent === correctAnswer) {
            btn.classList.add('correct');
          }
        });

        const isCorrect = selectedOption === correctAnswer;

        if (isCorrect) {
          score += 1;
          updateScore();
          button.classList.add('correct');
          showFeedback(true, '맞았습니다! 훌륭해요.');
        } else {
          button.classList.add('incorrect');
          showFeedback(false, `아쉽습니다. 정답은 ${correctAnswer}입니다.`);
        }

        setTimeout(() => {
          currentQuestionIndex += 1;
          if (currentQuestionIndex < questions.length) {
            loadQuestion();
          } else {
            showResults();
          }
        }, 1300);
      }

      function renderReviewScreen() {
        reviewList.innerHTML = '';

        questions.forEach((question, index) => {
          const selectedAnswer = selectedAnswers[index] ?? '답안 없음';
          const isCorrect = selectedAnswer === question.answer;

          const item = document.createElement('li');
          item.className = 'review-item';

          const questionLabel = document.createElement('strong');
          questionLabel.textContent = `문제 ${index + 1}: ${question.question}`;

          const selectedText = document.createElement('p');
          selectedText.innerHTML = `선택한 답: <span>${selectedAnswer}</span>`;

          const answerText = document.createElement('p');
          answerText.innerHTML = `정답: <span>${question.answer}</span>`;

          const statusText = document.createElement('p');
          statusText.className = `review-status ${isCorrect ? 'correct' : 'incorrect'}`;
          statusText.textContent = isCorrect ? '정답' : '오답';

          item.appendChild(questionLabel);
          item.appendChild(selectedText);
          item.appendChild(answerText);
          item.appendChild(statusText);
          reviewList.appendChild(item);
        });
      }

      function toggleReviewPanel() {
        const isHidden = reviewPanel.hasAttribute('hidden');

        if (isHidden) {
          renderReviewScreen();
          reviewPanel.removeAttribute('hidden');
          reviewToggleBtn.textContent = '답안 숨기기';
          reviewToggleBtn.setAttribute('aria-expanded', 'true');
        } else {
          reviewPanel.setAttribute('hidden', 'hidden');
          reviewToggleBtn.textContent = '답안 다시 보기';
          reviewToggleBtn.setAttribute('aria-expanded', 'false');
        }
      }

      function showResults() {
        quizPanel.setAttribute('hidden', 'hidden');
        resultPanel.classList.add('show');
        reviewPanel.setAttribute('hidden', 'hidden');
        reviewToggleBtn.textContent = '답안 다시 보기';
        reviewToggleBtn.setAttribute('aria-expanded', 'false');

        const percentage = Math.round((score / questions.length) * 100);
        finalScore.textContent = `${score}`;

        if (percentage >= 80) {
          resultTitle.textContent = '우주 천재!';
          resultEmoji.textContent = '🌌';
          resultMessage.textContent = '당신은 진짜 우주 탐험가입니다. 별의 세계를 완벽히 정복했어요!';
        } else if (percentage >= 50) {
          resultTitle.textContent = '좋은 궤도!';
          resultEmoji.textContent = '🚀';
          resultMessage.textContent = '기본 지식은 탄탄해요. 몇 번 더 비행하면 전문가가 될 거예요.';
        } else if (percentage >= 30) {
          resultTitle.textContent = '좋은 시도!';
          resultEmoji.textContent = '🪐';
          resultMessage.textContent = '우주 여행의 첫걸음을 잘 내딛고 있습니다. 계속 도전해 보세요.';
        } else {
          resultTitle.textContent = '훈련 모드';
          resultEmoji.textContent = '🌠';
          resultMessage.textContent = '모든 우주 비행사가 처음엔 작은 발걸음부터 시작합니다. 다시 도전해 보세요!';
        }
      }

      function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        selectedAnswers = Array(questions.length).fill(null);
        updateScore();
        resultPanel.classList.remove('show');
        reviewPanel.setAttribute('hidden', 'hidden');
        reviewToggleBtn.textContent = '답안 다시 보기';
        reviewToggleBtn.setAttribute('aria-expanded', 'false');
        reviewList.innerHTML = '';
        quizPanel.removeAttribute('hidden');
        loadQuestion();
      }

      reviewToggleBtn.addEventListener('click', toggleReviewPanel);
      restartBtn.addEventListener('click', resetQuiz);

      updateScore();
      loadQuestion();
    </script>
  </body>
</html>
